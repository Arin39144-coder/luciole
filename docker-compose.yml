version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: luciole-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-luciole}
      MYSQL_USER: ${MYSQL_USER:-luciole}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-luciole_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luciole-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-luciole}:${MYSQL_PASSWORD:-luciole_pass}@db:3306/${MYSQL_DATABASE:-luciole}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./dashboard:/app/dashboard:ro

  # Optional: standalone dashboard dev server (backend serves dashboard in production)
  # dashboard-dev:
  #   image: nginx:alpine
  #   ports:
  #     - "5000:80"
  #   volumes:
  #     - ./dashboard:/usr/share/nginx/html:ro

volumes:
  mysql_data:
