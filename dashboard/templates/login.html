{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block navlinks %}
<a href="/register" class="text-slate-400 hover:text-luciole-400">Inscription</a>
{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="text-2xl font-bold mb-6 text-center">Connexion</h1>
  <form id="login-form" class="space-y-4">
    <div>
      <label class="block text-sm text-slate-400 mb-1">Email</label>
      <input type="email" id="email" required
        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:border-luciole-500 focus:outline-none">
    </div>
    <div>
      <label class="block text-sm text-slate-400 mb-1">Mot de passe</label>
      <input type="password" id="password" required
        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:border-luciole-500 focus:outline-none">
    </div>
    <p id="error" class="text-red-400 text-sm hidden"></p>
    <button type="submit" class="w-full py-3 bg-luciole-500 hover:bg-luciole-600 text-slate-950 font-bold rounded-xl transition">
      Se connecter
    </button>
  </form>
  <p class="text-center text-slate-500 text-sm mt-4">
    Pas de compte ? <a href="/register" class="text-luciole-400 hover:underline">S'inscrire</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('error');
  err.classList.add('hidden');
  try {
    const data = await LucioleAPI.login(
      document.getElementById('email').value,
      document.getElementById('password').value
    );
    LucioleAuth.setToken(data.access_token, data.user);
    window.location.href = '/dashboard';
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove('hidden');
  }
});
if (LucioleAuth.getToken()) window.location.href = '/dashboard';
</script>
{% endblock %}
